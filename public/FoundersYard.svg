<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" font-family="'Courier New', ui-monospace, monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
